[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-rough"
version = "1.1.0"
description = "Minimal IsaacLab Ant rough-terrain Ant inference and assignment evaluation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ant_rough*"]
